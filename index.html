<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CIMERX Short Link</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<div class="card">

<h1>CIMERX SHORT LINK</h1>

<p>Buat short link gratis.</p>

<input
type="url"
id="longUrl"
placeholder="Masukkan URL..."
autocomplete="off">

<button id="createBtn">
START SHORT LINK
</button>

<div id="loading" style="display:none;">
Sedang membuat short link...
</div>

<div id="result" style="display:none;">

<input
id="shortUrl"
readonly>

<button id="copyBtn">
COPY LINK
</button>

</div>

</div>

</div>

<script type="module" src="firebase.js"></script>
<script type="module" src="app.js"></script>

</body>
</html>
