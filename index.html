<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CIMERX Hyper + Short Link</title>

<meta name="theme-color" content="#0f172a">

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- LOGIN -->

<div id="loginPage" class="page">

<div class="card loginCard">

<h1>CIMERX</h1>

<p class="subtitle">

Hyper Link + Short Link

</p>

<div class="logo">

🔐

</div>

<label>

Masukkan API Key

</label>

<input

type="password"

id="apikey"

placeholder="API KEY">

<button id="loginBtn">

MASUK

</button>

<p id="loginStatus">

Masukkan API Key untuk melanjutkan

</p>

</div>

</div>

<!-- DASHBOARD -->

<div

id="dashboard"

class="page"

style="display:none;">

<div class="card">

<div class="header">

<h1>CIMERX</h1>

<button id="logoutBtn">

Logout

</button>

</div>

<p class="subtitle">

Hyper Link + Short Link Generator

</p>

<label>

Masukkan URL Roblox

</label>

<input

id="url"

type="text"

placeholder="https://roblox.com/games/..."

autocomplete="off"

spellcheck="false">

<button

id="start"

disabled>

START

</button>

<div

id="loading"

style="display:none;">

Membuat Short Link...

</div>

<div

id="preview"

style="display:none;">

<img

id="previewImage"

src=""

alt="Preview">

<div class="previewInfo">

<div class="top">

<img

id="favicon"

src=""

alt="">

<div>

<h3 id="title">

Roblox

</h3>

<p id="description">

Preview akan muncul di sini

</p>

</div>

</div>

</div>

</div>
<!-- HASIL -->

<div id="result" style="display:none;">

<label>

Short Link

</label>

<input

id="short"

readonly>

<button id="copyShort">

Copy Short Link

</button>

<label>

Hyper Link

</label>

<textarea

id="markdown"

readonly>

</textarea>

<button id="copyMarkdown">

Copy Hyper Link

</button>

</div>

</div>

</div>

<!-- TOAST -->

<div

id="toast"

class="toast">

Berhasil

</div>

<!-- FIREBASE -->

<script type="module" src="firebase.js"></script>

<!-- SCRIPT -->

<script type="module" src="script.js"></script>

</body>

</html>
