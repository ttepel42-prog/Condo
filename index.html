<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CIMERX Short Link</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ========================= -->
<!-- LOGIN -->
<!-- ========================= -->

<div id="loginPage" class="page">

<div class="login-box">

<h1>CIMERX</h1>

<p>Hyper Link + Short Link Generator</p>

<input
type="password"
id="apikey"
placeholder="Masukkan API Key">

<button id="loginBtn">

MASUK

</button>

<p id="loginStatus"></p>

</div>

</div>

<!-- ========================= -->
<!-- DASHBOARD -->
<!-- ========================= -->

<div id="dashboard" class="page" style="display:none;">

<div class="container">

<div class="header">

<h2>CIMERX Dashboard</h2>

<button id="logoutBtn">

Logout

</button>

</div>

<label>

Masukkan URL Roblox

</label>

<input
id="url"
type="text"
placeholder="https://roblox.com/games/...">

<button
id="start"
disabled>

START

</button>

<div
id="loading"
style="display:none;">

Membuat Short Link...

</div>

<div
id="preview"
style="display:none;">

<img
id="previewImage"
src=""
alt="Preview">

<div class="previewContent">

<img
id="favicon"
src=""
alt="">

<div>

<h3 id="title">

Roblox

</h3>

<p id="description">

Preview akan muncul di sini

</p>

</div>

</div>

</div>
<!-- ========================= -->
<!-- HASIL -->
<!-- ========================= -->

<div id="result" style="display:none;">

<label>

Short Link

</label>

<input
id="short"
readonly>

<button id="copyShort">

Copy Short Link

</button>

<label>

Hyper Link

</label>

<textarea
id="markdown"
rows="5"
readonly>

</textarea>

<button id="copyMarkdown">

Copy Hyper Link

</button>

</div>

</div>

</div>

<!-- ========================= -->
<!-- TOAST -->
<!-- ========================= -->

<div id="toast" class="toast">

Berhasil

</div>

<!-- ========================= -->
<!-- FIREBASE -->
<!-- ========================= -->

<script type="module" src="firebase.js"></script>

<!-- ========================= -->
<!-- SCRIPT -->
<!-- ========================= -->

<script type="module" src="script.js"></script>

</body>

</html>
