<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>condoGames Shortener</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-900 to-indigo-700 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden">
    <div class="bg-gradient-to-r from-blue-700 to-indigo-600 p-8 text-white text-center">
      <h1 class="text-4xl font-bold">🔗 condoGames</h1>
      <p class="opacity-90">Link Shortener</p>
    </div>

    <div class="p-8">
      <input id="url" type="url" placeholder="Masukkan link panjang..." 
             class="w-full px-5 py-4 border-2 rounded-2xl text-lg focus:outline-none">
      
      <button onclick="shorten()" 
              class="mt-6 w-full py-5 bg-blue-600 text-white font-bold text-xl rounded-2xl">
        🚀 PENDEKKAN LINK
      </button>

      <div id="result" class="hidden mt-8"></div>
    </div>
  </div>

  <script>
    function generateCode() {
      return Math.random().toString(36).substring(2,10);
    }

    function shorten() {
      let longUrl = document.getElementById('url').value.trim();
      if (!longUrl) return alert("Masukkan link!");

      if (!longUrl.startsWith('http')) longUrl = 'https://' + longUrl;

      const code = generateCode();
      const shortUrl = `https://condogames.my.id/${code}`;

      document.getElementById('result').innerHTML = `
        <p class="text-green-600 font-bold mb-3">✅ Short Link:</p>
        <a href="\( {shortUrl}" target="_blank" class="block text-blue-600 text-lg font-mono break-all"> \){shortUrl}</a>
        <button onclick="copy('${shortUrl}')" class="mt-6 w-full py-4 bg-gray-800 text-white rounded-2xl font-bold">📋 Copy</button>
      `;
      document.getElementById('result').classList.remove('hidden');
    }

    function copy(text) {
      navigator.clipboard.writeText(text);
      alert("✅ Link berhasil dicopy!");
    }
  </script>
</body>
  </html>
