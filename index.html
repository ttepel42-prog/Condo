<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Condogames Shortener</title>
<style>
    :root {
        --bg: #0f1115;
        --card: #171a21;
        --accent: #4f8cff;
        --accent-hover: #6ea1ff;
        --text: #e8eaed;
        --muted: #8b93a3;
        --border: #2a2e38;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        padding: 20px;
    }
    .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }
    h1 {
        font-size: 22px;
        margin: 0 0 4px;
        text-align: center;
    }
    p.subtitle {
        color: var(--muted);
        text-align: center;
        margin: 0 0 24px;
        font-size: 14px;
    }
    input[type="text"] {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: #0f1115;
        color: var(--text);
        font-size: 14px;
        margin-bottom: 14px;
        outline: none;
    }
    input[type="text"]:focus {
        border-color: var(--accent);
    }
    button {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 10px;
        background: var(--accent);
        color: white;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled {
        background: #3a3f4b;
        cursor: not-allowed;
    }
    .result {
        margin-top: 20px;
        padding: 14px;
        border-radius: 10px;
        background: #0f1115;
        border: 1px solid var(--border);
        display: none;
    }
    .result.show { display: block; }
    .result.error {
        border-color: #b3413e;
    }
    .result a {
        color: var(--accent);
        word-break: break-all;
        text-decoration: none;
        font-weight: 600;
    }
    .result a:hover { text-decoration: underline; }
    .copy-btn {
        margin-top: 10px;
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
        font-size: 13px;
        padding: 8px;
    }
    .copy-btn:hover {
        background: var(--border);
        color: var(--text);
    }
</style>
</head>
<body>

<div class="card">
    <h1>🔗 Condogames Shortener</h1>
    <p class="subtitle">Pendekkan link kamu jadi condogames.my.id/kode</p>

    <input type="text" id="urlInput" placeholder="Tempel link tujuan di sini (https://...)">
    <button id="startBtn">Start Short Link</button>

    <div class="result" id="result">
        <div id="resultContent"></div>
        <button class="copy-btn" id="copyBtn" style="display:none;">Salin Link</button>
    </div>
</div>

<script>
    // Ganti sesuai key rahasia yang kamu set di shortener.php
    const SECRET_KEY = "RAHASIA123";

    const startBtn = document.getElementById('startBtn');
    const urlInput = document.getElementById('urlInput');
    const result = document.getElementById('result');
    const resultContent = document.getElementById('resultContent');
    const copyBtn = document.getElementById('copyBtn');
    let lastShortUrl = "";

    startBtn.addEventListener('click', async () => {
        const url = urlInput.value.trim();

        if (!url) {
            showResult("Masukkan link terlebih dahulu.", true);
            return;
        }

        startBtn.disabled = true;
        startBtn.textContent = "Memproses...";

        try {
            const apiUrl = `shortener.php?action=create&format=json&key=${encodeURIComponent(SECRET_KEY)}&url=${encodeURIComponent(url)}`;
            const res = await fetch(apiUrl);
            const data = await res.json();

            if (data.success) {
                lastShortUrl = data.short_url;
                resultContent.innerHTML = `Berhasil dibuat:<br><a href="${data.short_url}" target="_blank">${data.short_url}</a>`;
                result.classList.remove('error');
                copyBtn.style.display = 'block';
            } else {
                showResult(data.error || "Terjadi kesalahan.", true);
            }
        } catch (err) {
            showResult("Gagal terhubung ke server.", true);
        }

        result.classList.add('show');
        startBtn.disabled = false;
        startBtn.textContent = "Start Short Link";
    });

    copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(lastShortUrl).then(() => {
            copyBtn.textContent = "Tersalin!";
            setTimeout(() => copyBtn.textContent = "Salin Link", 1500);
        });
    });

    function showResult(message, isError) {
        resultContent.textContent = message;
        result.classList.toggle('error', isError);
        copyBtn.style.display = 'none';
        result.classList.add('show');
    }
</script>

</body>
</html>
