<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>condosmap</title>

<meta name="theme-color"
content="#0f172a">

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="container">

<div class="card">

<h1>CIMERX</h1>

<p class="subtitle">

Hyper Link + Short Link Generator

</p>

<!-- API KEY -->

<label>

API KEY

</label>

<input

id="apikey"

type="password"

placeholder="Masukkan Key">

<div

id="keyStatus"

class="status">

Masukkan Key Terlebih Dahulu

</div>

<!-- URL -->

<label>

URL

</label>

<input

id="url"

type="text"

placeholder="https://..."

autocomplete="off"

spellcheck="false">

<button

id="start"

disabled>

START

</button>

<div

id="loading"

style="display:none;">

Membuat Short Link...

</div>

<!-- Preview -->

<div

id="preview"

style="display:none;">

<img

id="previewImage"

src=""

alt="Preview">

<div class="previewInfo">

<div class="top">

<img

id="favicon"

src=""

alt="">

<div>

<h3

id="title">

Tidak Ada Judul

</h3>

<p

id="description">

Tidak Ada Deskripsi

</p>

</div>

</div>

</div>

</div>

<!-- RESULT -->

<div

id="result"

style="display:none;">

<label>

Short Link

</label>

<input

id="short"

readonly>

<button

id="copyShort">

Copy Short Link

</button>

<label>

Hyper Link

</label>

<textarea

id="markdown"

readonly>

</textarea>

<button

id="copyMarkdown">

Copy Hyper Link

</button>

</div>

</div>

</div>

<!-- Toast -->

<div

id="toast"

class="toast">

Berhasil

</div>

<!-- Firebase -->

<script type="module"

src="firebase.js">

</script>

<!-- Script -->

<script type="module"

src="script.js">

</script>

</body>

</html>
