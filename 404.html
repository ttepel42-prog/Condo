<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirect...</title>

<style>
html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:transparent;
    overflow:hidden;
}
</style>

<script type="module">

import { getShort, addClick } from "./firebase.js";

const code = window.location.pathname.substring(1);

(async()=>{

    if(!code){

        window.location.replace("/");

        return;

    }

    const data = await getShort(code);

    if(!data){

        window.location.replace("/");

        return;

    }

    try{

        await addClick(code);

    }catch(e){}

    // LANGSUNG REDIRECT TANPA ANIMASI
    window.location.replace(data.url);

})();

</script>

</head>

<body>

</body>
</html>
