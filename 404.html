<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Condosgames</title>

<style>

html,
body{

margin:0;

padding:0;

width:100%;

height:100%;

background:#0f172a;

}

</style>

</head>

<body>

<script type="module">

import {

getShort,

addClick

} from "./firebase.js";

const code = location.pathname
.replace(/^\/+/,"")
.replace(/\/$/,"");

if(code===""){

location.replace("/");

}else{

try{

const data = await getShort(code);

if(data){

await addClick(code);

location.replace(data.url);

}else{

location.replace("/");

}

}catch(e){

console.error(e);

location.replace("/");

}

}

</script>

</body>

</html>
